name: ReSecure CI/CD & Automated Assurance Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'feature/resecure*'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-and-gates:
    name: Backend Assurance, AI Benchmarks & 12 Acceptance Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: resecure/requirements-dev.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r resecure/requirements-dev.txt

      - name: Static Syntax Verification & Compilation
        run: |
          python -m compileall -q resecure/backend/src resecure/evals tests

      - name: Run Core Backend Engine & API Unit/Integration Tests (48 Tests)
        run: |
          python -m pytest resecure/backend/tests -v --tb=short

      - name: Run AI/ML Information-Theoretic Recovery Benchmarks (16 Tests)
        run: |
          python -m pytest resecure/evals/test_aiml_evals.py -v --tb=short

      - name: Execute 12 Acceptance & Testing Gates (tests/test_resecure_acceptance_gates.py)
        run: |
          python -m pytest tests/test_resecure_acceptance_gates.py -v --tb=short

  frontend-validation:
    name: Frontend Typecheck, Invariant Tests & Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: resecure/frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: resecure/frontend
        run: |
          npm ci

      - name: TypeScript Strict Typecheck (tsc --noEmit)
        working-directory: resecure/frontend
        run: |
          npm run typecheck

      - name: Run Frontend Invariant & Contract Verification (9 Tests)
        working-directory: resecure/frontend
        run: |
          npm test

      - name: Build Production Distribution Bundle (Vite)
        working-directory: resecure/frontend
        run: |
          npm run build

      - name: Verify Production Distribution Artifacts
        run: |
          test -f resecure/frontend/dist/index.html
          echo "Frontend production artifact verified successfully."

  security-secret-audit:
    name: Zero-Secret Audit & Air-Gap Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Static Security & Secret Leakage Audit
        shell: pwsh
        run: |
          $secretViolations = @()
          $suspiciousPatterns = @(
              "AIza[0-9A-Za-z-_]{35}",
              "ghp_[0-9a-zA-Z]{36}",
              "PRIVATE KEY-----",
              "sk_live_[0-9a-zA-Z]{24}",
              "AKIA[0-9A-Z]{16}"
          )
          $codeFiles = Get-ChildItem -Recurse -File -Path resecure -Include "*.py", "*.ts", "*.tsx", "*.js", "*.mjs", "*.sql", "*.yaml" -Exclude "node_modules", "package-lock.json", ".git", "venv"

          foreach ($f in $codeFiles) {
              $content = Get-Content $f.FullName -Raw -ErrorAction SilentlyContinue
              if ($content) {
                  foreach ($p in $suspiciousPatterns) {
                      if ($content -match $p) {
                          $secretViolations += "$($f.FullName): Pattern $p matched"
                      }
                  }
              }
          }

          if ($secretViolations.Count -eq 0) {
              Write-Host "Secret scan passed: 0 credentials or leaked keys detected across $($codeFiles.Count) files." -ForegroundColor Green
          } else {
              Write-Error "Secret scan failed! Potential leaked credentials found:`n$($secretViolations -join "`n")"
              exit 1
          }

  docker-build-verification:
    name: Container Multi-Stage Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ReSecure Backend Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: resecure/Dockerfile.backend
          push: false
          tags: resecure-backend:ci

      - name: Build ReSecure Frontend Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: resecure/Dockerfile.frontend
          push: false
          tags: resecure-frontend:ci
